name: givemethegrind

services:
  givemethegrind:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: givemethegrind
    pull_policy: build
    ports:
      - "${SMARTBOMHUS_PUBLISHED_PORT:-3110}:80"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://127.0.0.1/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
